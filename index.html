<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jafra Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gSpark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C7EF5"/><stop offset="1" stop-color="#E37AB3"/></linearGradient></defs>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z" style="fill:var(--spark-fill,url(#gSpark))"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" style="fill:var(--spark-fill,url(#gSpark))"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-2zM15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-pod" viewBox="0 0 24 24"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9z"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4A1.5 1.5 0 0 0 20 19l-6-10V3"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="M5.5 8h1.5M5.5 11h1.5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></symbol>
</svg>

<div class="app" id="app">

  <!-- ================================================================ <TopBar> -->
  <header class="topbar" data-component="TopBar">
    <!-- <BrandCard> -->
    <div class="tb-card glass brand-card" data-component="BrandCard"><a class="logo" href="#" aria-label="Jafra Z home"><img src="/logo-128.png" alt=""><span class="brand">Jafra <b>Z</b></span></a></div>
    <!-- <SidebarToggle> (own card) -->
    <button class="tb-card glass side-toggle" id="drawerBtn" aria-label="Hide workloads pane" aria-controls="tree" aria-expanded="true" data-component="SidebarToggle"><svg class="icon"><use href="#i-sidebar"/></svg></button>
    <!-- <WorkloadIdentityCard> -->
    <div class="tb-card glass nav-card" id="navCard" data-component="ViewNav"></div>
    <div class="nav-pop" id="navPop" role="menu" hidden></div>
    <div class="tb-card glass ident-card ident" id="identCard" data-component="WorkloadIdentityCard" aria-live="polite"></div>
    <!-- <ActionsCard> -->
    <div class="tb-card glass right-card" data-component="ActionsCard">
      <!-- <AskKusmaToggle> -->
      <button class="ask-chip" id="askBtn" aria-pressed="true" aria-controls="chatWrap" aria-label="Ask KUSMA (toggle chat pane)">
        <svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkle"/></svg><span class="brand">Ask KUSMA</span>
      </button>
      <span class="vsep" aria-hidden="true"></span>
      <!-- <StatusChips> -->
      <div class="chips" role="group" aria-label="Service status" data-component="StatusChips" id="chips"></div>
      <button class="status-cluster" id="clusterBtn" aria-label="Service status" aria-haspopup="dialog" aria-expanded="false" aria-controls="statusPop"></button>
      <span class="vsep" aria-hidden="true"></span>
      <!-- <ThemeSwitcher> -->
      <button class="icon-btn theme-btn in-bar" id="themeBtn" aria-label="Switch to dark mode"><svg class="icon"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPop"><svg class="icon"><use href="#i-gear"/></svg></button>
    </div>
    <!-- <SettingsPopover> incl. hidden 'Demo states' control (mockup only) -->
    <div class="popover" id="settingsPop" role="dialog" aria-label="Settings" hidden>
      <h3>Settings</h3>
      <div class="row"><span>Theme</span><div class="seg" id="themeSeg"><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
      <div class="row"><span>Analyzer URL</span><input id="analyzerUrl" type="url" spellcheck="false" aria-label="Analyzer URL"></div>
      <details id="demoDetails">
        <summary>Demo states (mockup only)</summary>
        <div id="demoRows" style="margin-top:6px"></div>
        <div class="row"><span>Jafra data</span><div class="seg" id="dataSeg"><button data-v="data">Has data</button><button data-v="empty">No data</button></div></div>
        <div class="row"><span>Chat</span><button class="btn" style="padding:4px 10px;font-size:11px" id="replayBtn">Run demo investigation</button></div>
      </details>
    </div>
    <div class="popover" id="statusPop" role="dialog" aria-label="Service status" hidden></div>
      <div class="popover wl-pop" id="wlPop" role="dialog" aria-label="Select workload" hidden data-component="WorkloadPicker">
      <label class="search"><svg class="icon"><use href="#i-search"/></svg><span class="sr-only">Search workloads</span><input id="wlSearch" type="search" placeholder="Search namespace, pod, container or JVM…" autocomplete="off" role="combobox" aria-controls="wlList" aria-expanded="true"></label>
      <div class="pk-legend" aria-hidden="true"><span><i class="dot" data-state="live"></i>live</span><span><i class="dot" data-state="stale"></i>stale</span><span><i class="dot" data-state="ended"></i>ended</span><span style="margin-left:auto">↑ ↓ to move · Enter to open</span></div>
      <ul class="wl-list" id="wlList" role="listbox" aria-label="Namespace, workload, pod, container, JVM"></ul>
    </div>
  </header>

  <div class="body">
    <!-- ================================================================ <WorkloadTree> -->
    <aside class="tree glass" id="tree" aria-label="Workloads" data-component="WorkloadTree">
      <header>
        <div class="ttl"><h2>Workloads</h2></div>
        <!-- <NamespaceSelect> -->
        <div class="ns-select" data-component="NamespaceSelect">
          <button type="button" class="ns-btn" id="nsBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="nsPop"></button>
          <div class="ns-pop" id="nsPop" hidden>
            <label class="search"><svg class="icon"><use href="#i-search"/></svg><span class="sr-only">Search namespaces</span><input id="nsSearch" type="search" placeholder="Search namespaces…" autocomplete="off"></label>
            <ul role="listbox" id="nsList" aria-label="Namespaces"></ul>
          </div>
        </div>
        <label class="search"><svg class="icon"><use href="#i-search"/></svg><span class="sr-only">Search workloads</span><input id="treeSearch" type="search" placeholder="Search in namespace…" autocomplete="off"></label>
      </header>
      <div class="tree-legend" aria-hidden="true"><span><i class="dot" data-state="live"></i>live</span><span><i class="dot" data-state="stale"></i>stale</span><span><i class="dot" data-state="ended"></i>ended</span></div>
      <div class="tree-scroll"><ul role="tree" id="treeRoot" aria-label="Workload, pod, container, JVM"></ul></div>
    </aside>

    <!-- ================================================================ <MainArea> -->
    <main class="main" id="main" data-component="MainArea"></main>

    <!-- ================================================================ <ChatPane> -->
    <div class="chat-wrap" id="chatWrap" data-component="ChatPane">
      <div class="resize" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize chat pane" tabindex="0"></div>
      <section class="chat glass" id="chat" aria-label="KUSMA chat">
        <div class="chat-head">
          <svg class="sparkle" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-sparkle"/></svg>
          <span class="brand">KUSMA</span>
          <div class="grow"><span class="ctx-chip" id="ctxChip" title="This chat belongs to this workload only"><svg class="icon" style="width:13px;height:13px"><use href="#i-pod"/></svg><span id="ctxText">—</span></span></div>
          <button class="icon-btn close-chat" id="closeChat" aria-label="Close chat"><svg class="icon"><use href="#i-x"/></svg></button>
        </div>
        <div id="chatBanner"></div>
        <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversation"></div>
        <button class="sel-ask" id="selAsk" hidden><svg class="icon" style="width:13px;height:13px"><use href="#i-reply"/></svg>Ask about this</button>
        <!-- <QueueTray> -->
        <div class="queue" id="queue" hidden aria-live="polite">
          <div class="qh"><svg class="icon" style="width:15px;height:15px"><use href="#i-clock"/></svg><span id="queueTitle">Queued (0)</span><small>sent when KUSMA finishes</small></div>
          <ol id="queueList"></ol>
        </div>
        <!-- <Composer> -->
        <form class="composer" id="composer" autocomplete="off" data-component="Composer">
          <div class="cards" id="draftCards" aria-label="Attached context"></div>
          <label class="sr-only" for="input">Message KUSMA</label>
          <textarea id="input" rows="1" placeholder="Ask KUSMA about this workload…"></textarea>
          <div class="bar">
            <div class="persona" role="radiogroup" aria-label="Answer style" id="persona">
              <button type="button" role="radio" data-p="developer" aria-checked="true"><svg class="icon"><use href="#i-code"/></svg>Developer</button>
              <button type="button" role="radio" data-p="expert" aria-checked="false"><svg class="icon"><use href="#i-flask"/></svg>Expert</button>
            </div>
            <span class="hint" id="composerHint">Enter to send · Shift+Enter new line</span>
            <button type="button" class="stop" id="stopBtn" aria-label="Stop investigation" hidden><svg class="icon"><use href="#i-stop"/></svg></button>
            <button type="submit" class="send" id="sendBtn" aria-label="Send"><svg class="icon"><use href="#i-send"/></svg></button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<!-- ================================================================ <EmptyStates> -->
<template id="tpl-no-analyzer">
  <section class="empty glass" data-component="EmptyState.AnalyzerDown" role="alert">
    <div class="inner">
      <svg class="illus" viewBox="0 0 240 170" aria-hidden="true">
        <defs><linearGradient id="ea1" x1="0" x2="1"><stop offset="0" stop-color="#9FA1FF"/><stop offset="1" stop-color="#F9B2D7"/></linearGradient></defs>
        <ellipse cx="120" cy="152" rx="92" ry="10" fill="#9FA1FF" opacity=".18"/>
        <rect x="18" y="44" width="80" height="64" rx="16" fill="#fff" opacity=".9" stroke="#9FA1FF" stroke-width="2"/>
        <path d="M44 62l24 14-24 14z" fill="#9FA1FF"/><path d="M53 62l24 14-24 14z" fill="#F9B2D7" opacity=".8"/>
        <rect x="142" y="44" width="80" height="64" rx="16" fill="#fff" opacity=".9" stroke="#F9B2D7" stroke-width="2"/>
        <rect x="156" y="60" width="50" height="6" rx="3" fill="#BDEFC6"/><rect x="156" y="72" width="38" height="6" rx="3" fill="#FFE59A"/><rect x="156" y="84" width="44" height="6" rx="3" fill="#9FA1FF" opacity=".6"/>
        <path d="M98 76h12" stroke="url(#ea1)" stroke-width="5" stroke-linecap="round"/><rect x="106" y="67" width="9" height="18" rx="3" fill="#9FA1FF"/>
        <path d="M142 76h-12" stroke="url(#ea1)" stroke-width="5" stroke-linecap="round"/><rect x="125" y="67" width="9" height="18" rx="3" fill="#F9B2D7"/>
        <path d="M117 58l-4-8M123 58l4-8M120 56v-9" stroke="#E5484D" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="120" cy="126" r="13" fill="#fff" stroke="#E5484D" stroke-width="2.4"/><path d="M115 121l10 10M125 121l-10 10" stroke="#E5484D" stroke-width="2.4" stroke-linecap="round"/>
        <text x="58" y="126" font-size="10" text-anchor="middle" fill="#6C6E9E" font-family="Varela Round, sans-serif">Jafra Z</text>
        <text x="182" y="126" font-size="10" text-anchor="middle" fill="#6C6E9E" font-family="Varela Round, sans-serif">Analyzer</text>
      </svg>
      <h2>Can't reach Jafra Analyzer</h2>
      <p>Jafra Z needs the analyzer to continue.</p>
      <p class="detail">Tried <code>https://jafra-analyzer.demo:8443</code> · last attempt just now</p>
      <button class="btn btn-primary" id="retryBtn">Retry connection</button>
    </div>
  </section>
</template>
<template id="tpl-no-data">
  <section class="empty glass" data-component="EmptyState.NoData">
    <div class="inner">
      <svg class="illus" viewBox="0 0 240 170" aria-hidden="true">
        <ellipse cx="120" cy="152" rx="92" ry="10" fill="#9FA1FF" opacity=".18"/>
        <path d="M60 72l60-26 60 26v58l-60 22-60-22z" fill="#fff" opacity=".92" stroke="#9FA1FF" stroke-width="2" stroke-linejoin="round"/>
        <path d="M60 72l60 24 60-24M120 96v56" stroke="#9FA1FF" stroke-width="2" fill="none"/>
        <path d="M60 72l-16 20 60 24 16-20z" fill="#D9F9DF" stroke="#9FA1FF" stroke-width="2" stroke-linejoin="round"/>
        <path d="M180 72l16 20-60 24-16-20z" fill="#FFF0BE" stroke="#9FA1FF" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="120" cy="22" r="5" fill="#F9B2D7"/><circle cx="96" cy="34" r="3.5" fill="#9FA1FF"/><circle cx="146" cy="32" r="4" fill="#FFF0BE" stroke="#E5C96A"/>
        <path d="M120 30v10M104 42l6 6M138 42l-6 6" stroke="#F9B2D7" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/>
      </svg>
      <h2>No Jafra data yet</h2>
      <p>The analyzer is connected, but no JVM recordings have arrived.</p>
      <p class="detail">Check that <code>jafra-agent</code> is running on your nodes. New JVMs show up here automatically.</p>
      <button class="btn" id="refreshBtn">Check again</button>
    </div>
  </section>
</template>
<template id="tpl-connecting">
  <section class="empty glass" data-component="EmptyState.Connecting" aria-busy="true">
    <div class="inner"><div class="spinner" style="width:34px;height:34px;border-width:3px"></div><h2 style="font-size:var(--fs-xl)">Connecting to Jafra Analyzer…</h2><p class="detail">This usually takes a second.</p></div>
  </section>
</template>

<script type="module" src="/src/main.js"></script>
</html>
